<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Security: only load files from this site, no inline scripts, no forms. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="6en6ar's blog: malware analysis, OSINT and red teaming.">
  <meta name="theme-color" content="#000000">
  <title>6en6ar :: blog</title>
  <link rel="icon" href="gengar.ico">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="window">

    <div class="titlebar" aria-hidden="true">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="title">g3n6aR@darkside: ~/root</span>
    </div>

    <!-- Header navigation -->
    <nav class="tabs" aria-label="Main">
      <a href="index.html" class="active" aria-current="page">~/blog</a>
      <a href="about.html">about.txt</a>
    </nav>

    <div class="workspace">
      <!-- Left: list of posts (filled in by js/blog.js) -->
      <aside class="sidebar" aria-label="Posts">
        <div class="sidebar-title">EXPLORER</div>
        <div class="tree-root">&#9662; posts/</div>
        <ul class="tree" id="post-list"></ul>
        <nav class="pager" id="side-pager" aria-label="Pages"></nav>
      </aside>

      <!-- Right: the selected post (filled in by js/blog.js) -->
      <main class="editor">
        <div class="editor-bar"><div class="editor-tab" id="editor-tab">motd.txt</div></div>
        <div class="content" id="content">
          <p class="cmd"><span class="prompt">g3n6aR@darkside:~/root$</span> loading<span class="cursor"></span></p>
          <noscript><p class="error">This blog needs JavaScript enabled to load the posts.</p></noscript>
        </div>
      </main>
    </div>

    <!-- Footer -->
    <footer class="statusbar">
      <div class="group">
        <span class="mode">NORMAL</span>
        <span id="status-file">motd.txt</span>
        <span id="status-count"></span>
      </div>
      <div class="group">
        <a href="https://github.com/6en6ar" target="_blank" rel="noopener noreferrer">github</a>
        <a href="https://www.linkedin.com/in/pr0fil3/" target="_blank" rel="noopener noreferrer">linkedin</a>
        <a href="mailto:6en6ar@protonmail.com">mail</a>
        <span>UTF-8</span>
        <span>&copy; 6en6ar</span>
      </div>
    </footer>

  </div>

  <script src="js/markdown.js"></script>
  <script src="js/blog.js"></script>
</body>
</html>
